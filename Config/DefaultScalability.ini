; FULL THROTTLE 2.7: the performance pass. Only EPIC keeps Lumen (software GI and reflections).
; The cel post-process bands the light anyway, so below Epic the sky light and distance-field AO
; look the same (checked side by side in Bayshore, full-throttle-tests/v270/lumen) and the GPU
; skips Lumen's screen-probe gather, the biggest single cost on a slower card.

[GlobalIlluminationQuality@0]
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@1]
r.Lumen.DiffuseIndirect.Allow=0

[GlobalIlluminationQuality@2]
r.Lumen.DiffuseIndirect.Allow=0

[ReflectionQuality@0]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@1]
r.Lumen.Reflections.Allow=0

[ReflectionQuality@2]
r.Lumen.Reflections.Allow=0

; ------------------------------------------------------------------------------------------------------
; FULL THROTTLE 2.8: the second performance pass (profiled with profilegpu in a Development build,
; full-throttle-tests/v280). The cel pass bands the light into three tones, so Lumen's finest settings
; buy nothing you can see: EPIC now runs Lumen at the HIGH preset's gather settings.

[GlobalIlluminationQuality@3]
; screen probe gather was 2.5 ms (Bayshore) to 5.1 ms (Metro) of the EPIC frame
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.Lumen.ScreenProbeGather.StochasticInterpolation=1
r.Lumen.ScreenProbeGather.IrradianceFormat=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.Lumen.ScreenProbeGather.RadianceCache.NumProbesToTraceBudget=100
r.Lumen.ScreenProbeGather.NumAdaptiveProbes=16
r.Lumen.ScreenProbeGather.ShortRangeAO.DownsampleFactor=2
r.Lumen.ScreenProbeGather.ShortRangeAO.BentNormal=0
r.Lumen.ScreenProbeGather.ShortRangeAO.HorizonSearch.HZB=1
; translucent smoke and fire are lit by the sky light instead (0.4 ms)
r.Lumen.TranslucencyVolume.Enable=0
r.LumenScene.DirectLighting.UpdateFactor=64
r.LumenScene.Radiosity.UpdateFactor=128

[ReflectionQuality@3]
; Lumen reflections at half resolution (2.4 ms in Metro's glass towers at full)
r.Lumen.Reflections.DownsampleFactor=2
r.Lumen.Reflections.ScreenSpaceReconstruction.NumSamples=3
; 3.4: r.Lumen.Reflections.MaxRoughnessToTrace=0.15 is set in UFTGameInstance::ApplyQuality (not a scalability variable)

[AntiAliasingQuality@3]
; TSR's history at 100% instead of 200% (its update pass was 0.6 ms)
r.TSR.History.ScreenPercentage=100
; 3.4: no flicker detection at EPIC either (RejectShading 0.69 ms; HIGH has run without it since 2.8)
r.TSR.ShadingRejection.Flickering=0

[PostProcessQuality@2]
; one SSAO pass, not two
r.AmbientOcclusionLevels=1

[PostProcessQuality@1]
; MEDIUM: no SSAO (the cel bands and the ink carry the shape), half-resolution motion blur stays
r.AmbientOcclusionLevels=0

[PostProcessQuality@0]
r.AmbientOcclusionLevels=0
r.MotionBlurQuality=0

[AntiAliasingQuality@2]
; HIGH: TSR without its flicker detection (RejectShading was 0.53 of HIGH's 1.2 ms of TSR)
r.TSR.ShadingRejection.Flickering=0

; ------------------------------------------------------------------------------------------------------
; FULL THROTTLE 3.4: third performance pass (full-throttle-tests/v340). The sun and moon cast virtual
; shadow maps; their distance-field shadows were traced on top (0.35 ms of Metro's moonlight at EPIC)
; and changed nothing visible.
[ShadowQuality@3]
r.DistanceFieldShadowing=0

[ShadowQuality@2]
r.DistanceFieldShadowing=0
