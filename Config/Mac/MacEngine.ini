; FULL THROTTLE 2.9: Mac-only settings from the Mac performance audit (Apple M1 Max, 14 Nov 2026).
; This file is read only on a Mac (the editor that cooks a Mac package, and the Mac game). Windows is unaffected.

[/Script/Engine.RendererSettings]
; The game has no deferred decals (none in any map or asset). On the Mac's Metal SM5 path, where Nanite doesn't run,
; DBuffer decals force a full depth prepass: 0.4-1.8 ms of GPU on the audit's M1 Max. Off on the Mac only, because on
; Windows Nanite forces that prepass anyway, so turning it off there would only recompile every shader for nothing.
r.DBuffer=False
