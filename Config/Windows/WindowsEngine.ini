[/Script/Engine.UserInterfaceSettings]
; 3.9.2 (loop run 2 cycle 3): run per-monitor DPI aware on Windows. Without it a scaled display (125% / 150%, most laptops)
; tells the game a smaller desktop (2048x1152 for 2560x1440 at 125%, 1280x720 for 1080p at 150%) and Windows stretches
; the picture: soft image, blurry HUD text. Now the game renders at the panel's real resolution; dynamic resolution
; (budget 15.5 ms) absorbs the extra pixels and every HUD scales by screen height (ClipY / 720), so the layout is unchanged.
; Windows only: on a Retina Mac this would double the pixel count. -nohighdpi turns it off for a before/after run.
bAllowHighDPIInGameMode=True

[GameInput]
IncludeRedistFiles=True
